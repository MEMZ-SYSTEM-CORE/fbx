<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PageGPT</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="logo">⚡</div>
      <h1>PageGPT</h1>
    </div>
    <div class="header-actions">
      <button id="btn-settings" class="icon-btn" title="Settings">⚙️</button>
      <button id="btn-read-page" class="action-btn" title="Read current page">📖 Read Page</button>
    </div>
  </header>

  <!-- Page Info Bar -->
  <div id="page-info" class="page-info hidden">
    <div class="page-info-content">
      <span class="page-info-icon">📄</span>
      <span id="page-title" class="page-info-title">No page loaded</span>
    </div>
    <button id="btn-refresh" class="icon-btn-sm" title="Re-read page">🔄</button>
  </div>

  <!-- Settings Panel (hidden by default) -->
  <div id="settings-panel" class="settings-panel hidden">
    <div class="settings-header">
      <h2>API Settings</h2>
      <button id="btn-close-settings" class="icon-btn-sm">✕</button>
    </div>
    <div class="settings-body">
      <div class="field">
        <label for="ai-provider">AI Provider</label>
        <select id="ai-provider">
          <option value="openai">OpenAI</option>
          <option value="anthropic">Anthropic (Claude)</option>
        </select>
      </div>
      <div class="field">
        <label for="api-key">API Key</label>
        <input type="password" id="api-key" placeholder="sk-..." autocomplete="off">
        <span class="field-hint">Your key stays in this browser only</span>
      </div>
      <div class="field">
        <label for="model-select">Model</label>
        <select id="model-select"></select>
      </div>
      <button id="btn-save-settings" class="save-btn">Save Settings</button>
      <div id="settings-status" class="status-msg hidden"></div>
    </div>
  </div>

  <!-- Chat Area -->
  <div id="chat-area" class="chat-area">
    <div id="messages" class="messages">
      <div class="welcome-msg">
        <div class="welcome-icon">🤖</div>
        <h3>PageGPT - AI Page Editor</h3>
        <p>Click <strong>"📖 Read Page"</strong> to load the current page, then tell me what to change.</p>
        <div class="welcome-examples">
          <button class="example-btn" data-prompt="Make the background dark and change all text to white">🌙 Dark mode</button>
          <button class="example-btn" data-prompt="Change the main heading to be larger and blue">✏️ Edit heading</button>
          <button class="example-btn" data-prompt="Add a red border around the navigation bar">🎯 Highlight nav</button>
          <button class="example-btn" data-prompt="Replace the footer text with 'Modified by PageGPT'">📝 Change text</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Active Edits Bar -->
  <div id="edits-bar" class="edits-bar hidden">
    <span class="edits-count"><span id="edit-count">0</span> edits active</span>
    <button id="btn-undo-all" class="undo-btn">Revert All</button>
  </div>

  <!-- Input Area -->
  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="user-input" placeholder="Tell AI what to change... (e.g. &quot;make the header sticky with blur effect&quot;)" rows="1"></textarea>
      <button id="btn-send" class="send-btn" disabled>
        <span class="send-icon">➤</span>
      </button>
    </div>
    <div class="input-hint">
      <span id="page-status" class="status-dot">●</span>
      <span id="status-text">Click "Read Page" to start</span>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
